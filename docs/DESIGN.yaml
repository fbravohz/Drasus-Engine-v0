
# ============================================================
# MASTER APPLICATION DESIGN SYSTEM
# AI-FILLABLE DESIGN SPECIFICATION
# ============================================================
#
# PURPOSE:
# Single machine-readable source of truth for Drasus Engine design decisions.
# docs/DESIGN.md keeps narrative context; synchronize confirmed decisions across both files.
#
# WORKFLOW:
# 1. Agent investigates the project and relevant canonical sources.
# 2. Agent records verified facts and confirmed owner decisions.
# 3. Unresolved fields remain null or open questions until research or interview.
# 4. Implementation derives styling from this specification.
#
# CONVENTIONS:
# null = undecided, awaiting research or decision
# []   = collection awaiting population
# {}   = object awaiting population
#
# Token leaves use DTCG-inspired $type / $value structure.
# This YAML is a master specification, not a raw DTCG export.
#
# ============================================================

schema:
  name: application-design-specification
  version: "1.0.0"
  template: false
  language: es
  status: draft
  last_updated: "2026-11-02"

# ============================================================
# 00 — AI AGENT CONTRACT
# ============================================================

agent:
  role: "Principal Product Designer + Design Systems Architect"

  objective: >
    Investigate the application, understand its users,
    establish a coherent design direction, and maintain
    this specification with traceable design decisions.

  operating_rules:
    - Analyze the repository before defining design decisions.
    - Preserve existing brand decisions unless redesign is requested.
    - Prefer established conventions over arbitrary novelty.
    - Never invent user research or business requirements.
    - Never use visual trends without a functional rationale.
    - Keep primitive, semantic, and component tokens separate.
    - Reuse semantic tokens instead of hardcoded values.
    - Define responsive, interaction, and accessibility behavior.
    - Record significant decisions and their rationale.
    - Preserve YAML structure and valid syntax.
    - Distinguish canon facts, owner preferences, user research, and inference.
    - Do not mark a property false unless the owner or canon permanently excludes it.
    - Interview the owner by the requested blocks; keep unresolved fields open.
    - Do not implement UI unless explicitly requested.

  discovery:
    inspect:
      - Project documentation and requirements
      - Existing application screens
      - Design assets and brand guidelines
      - Installed UI libraries
      - Current styles and design tokens
      - Existing component architecture
      - Application routes and navigation
      - Data models and representative content
      - Existing accessibility patterns
      - Screenshots and user-provided references

  decision_priority:
    - Explicit user requirements
    - Existing product and brand specifications
    - Actual repository implementation
    - Existing design patterns
    - Accessibility and usability standards
    - Relevant established design conventions
    - Agent-proposed design decisions

  completion_policy:
    fill_resolvable_fields: true
    preserve_unresolved_as_null: true
    interview_before_closing_open_product_decisions: true
    record_assumptions: true
    record_tradeoffs: true
    avoid_placeholder_lorem_ipsum: true
    validate_token_references: true
    validate_yaml: true

  deliverables:
    - Completed specification
    - Unresolved questions
    - Design decision log
    - Consistency and accessibility audit
    - Proposed implementation mapping

# ============================================================
# 01 — PRODUCT CONTEXT
# ============================================================

