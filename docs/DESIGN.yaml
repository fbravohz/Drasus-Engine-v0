# ============================================================
# 05 — TOKEN ARCHITECTURE
# ============================================================

token_architecture:
  standard: "DTCG-inspired" # Estructura de esta ficha; no implica adoptar el estándar de intercambio en el proyecto.
  naming_convention: null

  hierarchy:
    - primitive
    - semantic
    - component

  principles:
    - Primitive tokens contain foundational values.
    - Semantic tokens communicate usage and meaning.
    - Component tokens define component-specific decisions.
    - Components should consume semantic or component tokens.
    - Themes override semantics without changing components.

  required_modes:
    - dark

  supported_token_types:
    - color
    - dimension
    - fontFamily
    - fontWeight
    - duration
    - cubicBezier
    - shadow
    - number
    - typography

