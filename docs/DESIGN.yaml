    composition_model: "Dashboard compone DashboardHeader, Sidebar, WidgetCard y WidgetEmptyState; WidgetCard recibe children."
    styling_strategy: "Tailwind CSS 4 y CSS local; los tokens canónicos todavía no están definidos."
    variant_strategy: "Variantes de widget nombradas por layout (results, period, standard); no se ha seleccionado una biblioteca externa."
    catalog_status: "No se migra el catálogo de widgets Flutter retirado por ADR-0165. Las categorías de registry no son componentes compartidos; las Cáscaras Visuales referencian una clave de specifications cuando exista y, si no, describen el rol de un componente local o pendiente. Las abstracciones compartidas se elevan con un segundo consumidor real según ADR-0139."
    component_library: "Sin selección; piloto visual HeroUI v3 frente a shadcn/ui + Radix después de definir tokens y comportamientos comunes."
