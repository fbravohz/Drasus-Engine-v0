# ============================================================
# 24 — DECISION LOG & TRACEABILITY
# ============================================================

decision_log:
  # Each record:
  # id, topic, decision, rationale, evidence,
  # alternatives, tradeoffs, confidence, status
  entries:
    - id: dashboard.visual-direction
      topic: "Dirección visual del Dashboard"
      decision: "Composición inicial de Overview; acabado y bordes de NestIQ; transparencia uniforme y halo blanco continuo."
      rationale: "Conserva la jerarquía y densidad elegidas por el propietario y aplica un material coherente entre widgets."
      evidence: ["docs/DESIGN.yaml, secciones 1, 3, 5 y 7", "docs/design/drasus-dashboard.html"]
      alternatives: []
      tradeoffs: ["La legibilidad del material depende del contenido y requiere validación."]
      confidence: high
      status: "Aprobada como dirección; tokens y legibilidad siguen pendientes."

    - id: dashboard.read-only
      topic: "Rol del Dashboard"
      decision: "Dashboard es centro de monitoreo de solo lectura; las ediciones ocurren en el Canvas."
      rationale: "Mantiene separadas la supervisión y la edición del dominio."
      evidence: ["docs/adr/ADR-0136.md"]
      alternatives: []
      tradeoffs: []
      confidence: high
      status: "Canónica; la cáscara actual aún no integra datos del Core."

    - id: product.canvas-primary-surface
      topic: "Canvas como superficie principal"
      decision: "Canvas es el atractivo principal para construir y conectar capacidades; Dashboard es la superficie oficial de monitoreo y navegación. Las features expuestas como nodos usan puertos tipados; visualizaciones y contenido dependen de cada contrato."
      rationale: "Representa la composición modular del producto sin asumir que toda feature requiere su propia gráfica o superficie. Los módulos pueden servir como presets para principiantes."
      evidence: ["docs/adr/ADR-0136.md", "docs/adr/ADR-0137.md", "docs/DESIGN.yaml"]
      alternatives: []
      tradeoffs: ["Canvas es dirección aprobada, pero aún no está implementado en la cáscara actual."]
      confidence: high
      status: "Dirección confirmada por el propietario y compatible con el canon; falta implementar y validar UX."

    - id: product.audience-and-jobs
      topic: "Audiencia y trabajos principales"
      decision: "La experiencia se dirige a principiantes y usuarios expertos de trading algorítmico; cubre construcción, investigación, evaluación, validación, operación, monitoreo y auditoría."
      rationale: "El Canvas y los módulos componen el trabajo visual; las superficies de producto cubren el ciclo completo de estrategias."
      evidence: ["docs/PRODUCT.md", "docs/PRODUCT-SIMPLE.md", "docs/DESIGN.yaml"]
      alternatives: []
      tradeoffs: ["Los segmentos y trabajos aún no están validados mediante investigación UX."]
      confidence: high
      status: "Dirección de producto confirmada; investigación UX pendiente."

    - id: visual.typography-profile
      topic: "Perfil tipográfico inicial"
      decision: "Geist Sans para texto y Geist Mono para cifras, seleccionadas juntas como perfil predeterminado."
      rationale: "La pareja fue aprobada en la dirección actual del Dashboard; la jerarquía numérica conserva énfasis sin convertir las muestras en tokens de producción."
      evidence: ["docs/DESIGN.yaml", "docs/design/drasus-dashboard.html", "docs/design/fonts/README.md"]
      alternatives: ["JetBrains Mono quedó como referencia, no como perfil aprobado."]
      tradeoffs: ["Perfiles alternativos y valores finales de escala siguen abiertos."]
      confidence: high
      status: "Perfil inicial aprobado; escala de producción pendiente."

    - id: visual.controls-and-customization
      topic: "Acabado de controles y personalización"
      decision: "Controles oscuros en cápsula o círculo según función, borde luminoso superior sutil y selección blanca con texto oscuro; personalización mediante opciones predefinidas y restauración del aspecto original."
      rationale: "Conserva la dirección visual elegida y limita combinaciones que podrían interferir con colores semánticos."
      evidence: ["docs/DESIGN.yaml", "docs/design/comparativa-materiales.html"]
      alternatives: []
      tradeoffs: ["Estados interactivos, tokens y catálogo de opciones requieren especificación y validación."]
      confidence: high
      status: "Dirección aprobada; valores de tokens y alternativas visuales pendientes."

    - id: components.react-catalog-lifecycle
      topic: "Catálogo de componentes para Tauri/React"
      decision: "No se migra el catálogo de widgets Flutter retirado. La Cáscara Visual cita una clave de components.specifications cuando exista; si no, describe un componente local o pendiente, sin exigir un ID. Los componentes se extraen al aparecer su segundo consumidor real. El Banco de Verificación conserva su función de harness por feature y no se usa como galería visual."
      rationale: "La especificación debe describir componentes disponibles sin reconstruir la biblioteca Flutter que se retiró; ADR-0139 evita abstraer componentes antes de tener consumidores reales."
      evidence: ["docs/adr/ADR-0117.md", "docs/adr/ADR-0135.md", "docs/adr/ADR-0139.md", "docs/adr/ADR-0152.md", "docs/adr/ADR-0165.md"]
      alternatives: ["Exigir IDs de catálogo para toda Cáscara Visual."]
      tradeoffs: ["El primer consumidor puede mantener un componente local; la extracción compartida queda para cuando aparezca el segundo consumidor real."]
      confidence: high
      status: "Regla vigente; las fichas de componentes se crearán cuando exista un consumidor real."

    - id: desktop.stack
      topic: "Stack de interfaz"
      decision: "Tauri 2 + React/TypeScript y Tailwind CSS; Core Rust y frontera gRPC/Protobuf."
      rationale: "Mantiene la UI delgada y separa dominio, persistencia y transporte."
      evidence: ["docs/adr/ADR-0165.md", "apps/desktop/package.json"]
      alternatives: []
      tradeoffs: ["El contrato gRPC del Dashboard aún no está conectado."]
      confidence: high
      status: "Canónica; integración parcial."

    - id: localization.base
      topic: "Idiomas base"
      decision: "Español e inglés con recursos JSON pareados y claves estables."
      rationale: "Permite agregar locales sin cambiar la lógica de interfaz."
      evidence: ["docs/adr/ADR-0160.md", "apps/desktop/src/localization/"]
      alternatives: []
      tradeoffs: ["La selección actual no persiste."]
      confidence: high
      status: "Canónica; selector de sesión implementado."

assumptions:
  confirmed:
    - "El Dashboard es la superficie oficial del producto, no un demo."
    - "El Canvas es el principal atractivo del producto; Dashboard complementa con monitoreo de solo lectura y navegación."
    - "La audiencia objetivo va de principiantes a expertos, aunque no hay personas validadas mediante investigación UX."
    - "Los trabajos principales cubren el ciclo más amplio que el monitoreo: construir, investigar, validar, operar, analizar y auditar."
    - "Geist Sans y Geist Mono son el perfil tipográfico inicial aprobado."
    - "La composición del Dashboard y el acento blanco están aprobados como dirección, no como tokens de producción."
  inferred:
    - "Los cortes actuales describen el reflujo de ventanas de escritorio; no permiten concluir ni descartar soporte futuro web, tablet o móvil."
    - "Los breakpoints y medidas CSS actuales describen la implementación presente, no una decisión canónica."
  unverified:
    - "Contraste y legibilidad de los widgets translúcidos con datos reales."
    - "Comportamiento visual a escala tipográfica global y tamaños de ventana representativos."
    - "Accesibilidad completa con lector de pantalla y teclado."
    - "Necesidades, perfiles y tareas prioritarias requieren investigación con usuarios; la confirmación del propietario no la reemplaza."

open_questions:
  # Each record:
  # id, question, impact, priority, proposed_resolution
  entries:
    - id: first-release-business-objectives
      question: "¿Qué resultado observable debe lograr el primer release distribuido como negocio y qué señales de éxito lo medirán?"
      impact: "Sin objetivos y métricas no se puede priorizar valor de negocio ni evaluar el resultado del release."
      priority: high
      proposed_resolution: "Entrevistar por el bloque Objectives; no inferir metas comerciales desde las capacidades de producto."
    - id: visual-tokens
      question: "¿Qué valores y nombres se aprobarán para tokens semánticos, tema oscuro, espaciado, radios y elevación; se requiere también un tema claro?"
      impact: "Evita que los valores provisionales del CSS se conviertan en canon."
      priority: high
      proposed_resolution: "Entrevistar por el bloque de fundamentos en docs/DESIGN.yaml."
    - id: responsive-rules
      question: "¿Qué cortes y reglas responsivas quedan aprobados tras validar ventanas representativas?"
      impact: "Afecta la jerarquía, navegación y legibilidad del Dashboard."
      priority: high
      proposed_resolution: "Validar el reflujo actual y ajustar el canon de diseño."
    - id: future-client-platforms
      question: "¿Qué prioridad y requisitos tendrán la adaptación responsive a tablet/móvil y un posible cliente web?"
      impact: "Afecta arquitectura de superficies, interacción, navegación, entrada táctil y verificación de plataforma."
      priority: medium
      proposed_resolution: "Conservar abierto; decidir por bloque de plataformas después de definir usuarios y recorridos."
    - id: widget-interaction
      question: "¿Cómo se reordenan widgets y cómo se ajusta su densidad con teclado y puntero?"
      impact: "Afecta personalización y accesibilidad del Dashboard."
      priority: high
      proposed_resolution: "Definir interacción, estados y alternativa al arrastre."
    - id: component-library
      question: "¿Se adopta una biblioteca de componentes después del piloto visual?"
      impact: "Afecta componentes y costos de mantenimiento."
      priority: medium
      proposed_resolution: "Seguir el piloto documentado en docs/DESIGN.yaml."
    - id: icon-library
      question: "¿Qué biblioteca o sistema de iconos se usará en producto?"
      impact: "Afecta consistencia, accesibilidad, licencia y mantenimiento de iconos."
      priority: medium
      proposed_resolution: "Explorar opciones junto con el piloto de componentes y documentar licencia y cobertura."
    - id: accessibility-target
      question: "¿Se confirma WCAG 2.2 AA como objetivo de diseño?"
      impact: "Define el alcance de verificación de contraste, foco, teclado y semántica."
      priority: high
      proposed_resolution: "Confirmar la propuesta en el bloque de accesibilidad."
    - id: locale-preference
      question: "¿Dónde se guarda la preferencia de idioma cuando exista el contrato de ajustes del Core?"
      impact: "El selector actual se reinicia al cerrar la aplicación."
      priority: medium
      proposed_resolution: "Definir el contrato de ajustes antes de persistir la preferencia."

implementation_roadmap:
  phases:
    - "Hecho: corregir la ficha inicial con hechos del producto y migrar la fuente única a docs/DESIGN.yaml; conservar abiertas las decisiones sin entrevista."
    - "Siguiente: entrevistar por bloques en el orden que indique el propietario, separando preferencias, canon e investigación UX."
    - "Después: actualizar los campos de cada bloque solo con decisiones confirmadas; mantener lo no definido como null o pregunta abierta."
  dependencies:
    - "Integración del Dashboard con datos reales del Core por la frontera gRPC definida en ADR-0165."
    - "Definición canónica de tokens y componentes en docs/DESIGN.yaml."
  risks:
    - "Confundir estilos provisionales implementados con tokens aprobados."
    - "Interpretar la composición responsiva actual como validada sin inspección visual."

