# ============================================================
# 02 — DESIGN RESEARCH & EVIDENCE
# ============================================================

research:
  repository_audit:
    status: "Parcial: se contrastaron canon, implementación y recursos; faltan inspección visual final y QA independiente."
    examined_files:
      - "AGENTS.md y docs/README.md"
      - "docs/DESIGN.yaml, docs/adr/ADR-0136.md, docs/adr/ADR-0137.md, docs/adr/ADR-0160.md y docs/adr/ADR-0165.md"
      - "docs/PRODUCT.md y docs/features/desktop-packaging-manager.md"
      - "apps/desktop/src/features/dashboard/Dashboard.tsx"
      - "apps/desktop/src/components/DashboardChrome.tsx, DashboardWidgets.tsx, WidgetCard.tsx y Controls.tsx"
      - "apps/desktop/src/data/dashboard.ts y apps/desktop/src/localization/"
      - "apps/desktop/src/styles.css y apps/desktop/package.json"
      - "docs/design/drasus-dashboard.html"
    existing_patterns:
      - "El Dashboard implementado es la superficie oficial actual, compuesto por cinco widgets: resultados, período, investigación, portafolios y riesgo."
      - "El Canvas es la atracción principal y superficie central de composición según dirección confirmada por el propietario; aún no está implementado en la cáscara actual."
      - "Los cinco widgets presentan estados vacíos localizados; el encabezado informa que los datos del Core no están disponibles."
      - "La navegación lateral puede expandirse con hover/foco y fijarse abierta; en ventanas angostas cambia a navegación superior."
      - "El selector de idioma cambia entre español e inglés durante la sesión; la selección no persiste."
      - "La cuadrícula usa doce columnas en ventanas amplias y refluye a seis o una columna en los cortes CSS actuales."
      - "La UI usa componentes React separados, SVG locales y fuentes Geist locales."
    inconsistencies:
      - "La composición actual y el orden de widgets son fijos; ADR-0136 y docs/DESIGN.yaml prevén widgets reorganizables y densidad ajustable."
      - "No hay datos reales ni integración gRPC en la cáscara actual; no se deben presentar sus estados vacíos como métricas del Core."
      - "El CSS contiene valores directos de color, espacio, radio y tipografía; docs/DESIGN.yaml aún no aprueba tokens de producción."
      - "Los cortes responsivos están implementados en CSS, pero su medida y comportamiento aún no están validados como reglas canónicas."
      - "La navegación estrecha implementada solo demuestra reflujo en ventanas de escritorio; no decide la compatibilidad futura con tablet, móvil o web."
      - "No existe docs/design/comparativa-tipografia.html; la ficha de fuentes conserva JetBrains Mono como referencia, mientras Geist sigue como perfil predeterminado aprobado."
    reusable_assets:
      - "Componentes React de navegación, encabezado, botón de icono, tarjeta de widget y estado vacío."
      - "Fuentes Geist Sans y Geist Mono empaquetadas localmente."
      - "Iconos SVG locales mediante el componente Icon."

  visual_references:
    inspiration:
      - "Overview: composición, distribución, densidad y controles iniciales del Dashboard."
      - "NestIQ: acabado y bordes de superficies; en Drasus los widgets tienen más transparencia."
      - "docs/design/comparativa-materiales.html: dirección aprobada con datos ilustrativos; no define valores de tokens de producción."
      - "Las referencias top1.webp, top2.webp y top3.webp están fuera del repositorio en ../inspiration/ y pueden no estar disponibles para otros colaboradores."
    competitors: []
    anti_references: []

  user_research:
    available_evidence:
      - "Preferencias y decisiones del propietario documentadas en docs/DESIGN.yaml; no son hallazgos de investigación con usuarios."
      - "El propietario confirmó Canvas como principal atractivo, audiencia desde principiantes hasta expertos y recorridos más amplios que el monitoreo; esto no sustituye investigación UX."
    usability_findings: []
    unverified_assumptions: []

  design_opportunities:
    usability:
      - "Definir el flujo para personalizar orden y densidad de widgets, incluida alternativa accesible al arrastre."
    visual:
      - "Validar la legibilidad del halo y las superficies translúcidas con datos representativos y tamaños de ventana distintos."
    accessibility:
      - "Verificar contraste, foco, teclado, ampliación y anuncios de estado en la ventana Tauri."
    performance: []

# ============================================================
# 03 — DESIGN STRATEGY
# ============================================================

strategy:
  design_vision: "Hacer del Canvas la superficie central para construir, investigar y conectar capacidades; el Dashboard complementa el ciclo con monitoreo de solo lectura, contexto y navegación."

  principles:
    primary:
      - "El Canvas es la superficie principal de composición; el Dashboard es una superficie complementaria de monitoreo y navegación."
      - "Cada feature expuesta como nodo conserva puertos tipados; sus entradas, salidas, gráficas e información dependen de su contrato y de lo que aplique."
      - "Componer capacidades por contratos de feature sin acoplar una feature a otra; los módulos sirven como presets, especialmente para facilitar el inicio."
      - "Separar y reutilizar componentes y tokens; no duplicar decisiones visuales entre consumidores."
      - "El Dashboard es de solo lectura y no inventa métricas cuando faltan datos."
    secondary: []

  personality:
    attributes: [refinado, moderno, tecnológico, pulido, premium]
    emotional_goals:
      - "Transmitir control durante la construcción, investigación y operación de sistemas de trading."
      - "Dar claridad sin sugerir rentabilidad garantizada."
    perception_goals:
      - "Sentirse como un centro de mando para el ciclo completo de trading algorítmico."
      - "Servir tanto a principiantes como a usuarios expertos; esta dirección no está validada por investigación UX."

  visual_direction:
    style: "Interfaz de escritorio oscura, con superficies translúcidas y un campo de luz blanco continuo."
    aesthetic_keywords: [oscura, modular, halo, translúcida, discreta]
    visual_complexity: null
    visual_density: "La composición inicial conserva la densidad de Overview; escala y valores numéricos pendientes."
    expressiveness: null
    contrast_philosophy: "El acento general inicial es blanco; los significados semánticos se preservan y los estados no dependen solo del color. La legibilidad de las superficies sigue por validar."
    geometry_philosophy: "Widgets con esquinas redondeadas; controles en cápsula o círculo según su función. Los radios exactos no son tokens aprobados."
    approved_materials:
      dashboard_widgets: "Superficies translúcidas uniformes con acabado y bordes inspirados en NestIQ; un halo blanco continuo cruza la interfaz en diagonal desde arriba a la derecha hacia abajo a la izquierda."
      halo_intensity: "La intensidad mostrada en la tercera pantalla de la comparativa está aprobada; los valores numéricos de token siguen pendientes."
      halo_tone: "Luz blanca sin matiz azul o gris."
      controls: "Controles oscuros en cápsula o círculo según su función, borde superior luminoso delicado, gradiente y sombra suaves; selección blanca con texto oscuro."
      validation: "La legibilidad del halo y los materiales con contenido real y tamaños representativos sigue pendiente."

  differentiation:
    distinctive_elements:
      - "Canvas nodal como superficie principal para componer procesos de trading algorítmico con features que exponen APIs mediante puertos tipados."
      - "Módulos predefinidos que orientan a principiantes y composición directa para usuarios expertos."
      - "Ciclo de producto que abarca investigación, generación, validación, incubación, operación y auditoría."
    signature_patterns:
      - "Conectar features mediante puertos tipados en un Canvas único; usar módulos como composiciones reutilizables."
    competitive_advantages: []

  anti_patterns:
    visual:
      - "Asignar materiales distintos a widgets por tipo; el material base debe ser uniforme según docs/DESIGN.yaml."
    interaction:
      - "Hacer depender una acción o dato exclusivamente de hover o arrastre."
    content:
      - "Mostrar datos de ejemplo como si fueran datos reales del Core."
      - "Tratar un resultado positivo como evidencia suficiente de que una estrategia está validada."

  decision_criteria:
    usability_weight: null
    accessibility_weight: null
    consistency_weight: null
    originality_weight: null
    implementation_cost_weight: null

